name: Run Sharp Money Bot

on:
  workflow_dispatch: # Elle test etme butonu yine kalsın
  schedule:
    - cron: '0 */2 * * *' # Her 2 saatte bir otomatik çalıştırır (Örn: 00:00, 02:00, 04:00...)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run bot
        run: |
          python bot.py
